<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}

.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif}
.logo{text-align:center;margin:8px 0 4px}
.logo h1{font-size:40px;line-height:1;margin:0;letter-spacing:.5px}
.logo h1 span{display:inline-block;transform:rotate(-4deg)}
.logo h1 .z{color:var(--pink);transform:rotate(5deg)}
.logo p{margin:6px 0 0;color:var(--muted);font-weight:700}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--line);padding:18px;margin:18px 0}
.btn{appearance:none;border:3px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--line);background:var(--yellow);color:var(--ink);font:700 18px Fredoka,sans-serif;padding:13px 18px;cursor:pointer;width:100%;transition:transform .08s, box-shadow .08s}

.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.story{display:flex;align-items:center;gap:14px;cursor:pointer;margin:14px 0;padding:14px}

.tag{display:inline-block;font:700 12px Nunito;background:var(--ink);color:#fff;border-radius:99px;padding:3px 9px;margin-left:6px;vertical-align:middle}
.progress{height:14px;border:3px solid var(--line);border-radius:99px;background:#fff;overflow:hidden;margin:4px 0 16px}
.progress>div{height:100%;background:var(--green);transition:width .3s}
.ask{font:700 15px Nunito;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.type{font:700 28px/1.15 Fredoka,sans-serif;margin:6px 0 4px}
.ex{color:var(--muted);font-weight:700;margin-bottom:14px}
input[type=text]{width:100%;font:700 22px Nunito;padding:14px;border:3px solid var(--line);border-radius:16px;outline:none;background:#FFFDF7}

.help{background:none;border:none;color:var(--blue);font:800 15px Nunito;text-decoration:underline;cursor:pointer;padding:6px 0;margin:6px 0 10px}

.text{font-size:19px;line-height:1.65}
.text b{background:var(--yellow);border:2px solid var(--line);border-radius:8px;padding:0 6px;white-space:nowrap;font-family:Fredoka}
.text b.on{background:var(--pink);color:#fff}

.vbtn{border:3px solid var(--line);border-radius:14px;background:#fff;font:700 16px Fredoka;padding:10px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}

.center{text-align:center}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.back{background:none;border:none;font:800 16px Nunito;color:var(--ink);cursor:pointer;padding:4px 0}
.hidden{display:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.small{font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;line-height:1.4;margin:12px 0 4px}

label.lb{display:block;font-weight:800;margin:10px 0 6px}

.dip .nm{font:700 clamp(34px,10vw,58px)/1 Fredoka;color:var(--blue);margin:8px 0;word-break:break-word}

</style>
</head>

function speak(k,el){
 voice=k; document.querySelectorAll(".vbtn").forEach(b=>b.classList.toggle("sel",b===el));
 const msg=document.getElementById("vmsg");
 if(!("speechSynthesis" in window)){msg.textContent="La lecture à voix haute n'est pas disponible sur cet appareil.";return}
 stopSpeech();
 const u=new SpeechSynthesisUtterance(cur.title+". "+filled(false));
 u.lang="fr-FR";
 const fr=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)); if(fr.length)u.voice=fr.find(v=>/fr-FR/i.test(v.lang))||fr[0];
 const P={normale:[1,1],souris:[2,1.25],geant:[0.75,0.75],robot:[0.5,0.85]}[k];
 if(k==="geant"){
  /* Géant : on cherche une voix d'homme française (iPhone/Mac : Thomas, Nicolas, Daniel ; Windows : Paul, Henri, Claude ; Android : voix masculines fr-fr-x-frd / vlf / frb). */
  const male=/thomas|nicolas|daniel|paul|henri|claude|mathieu|antoine|jacques|male|homme|masculin|fr-fr-x-(frd|vlf|frb)/i;
  const m=fr.find(v=>/fr-FR/i.test(v.lang)&&male.test(v.name+" "+v.voiceURI))||fr.find(v=>male.test(v.name+" "+v.voiceURI));
  if(m){u.voice=m;P[0]=0.5;P[1]=0.8}  /* voix d'homme trouvée : grave et lente */
  /* sinon (voix de femme seule) : on ralentit sans trop baisser, pour éviter l'effet « sorcière » */
 }
 u.pitch=P[0];u.rate=P[1];
 u.onerror=()=>{msg.textContent="Le son n'a pas pu démarrer : vérifie que ton téléphone n'est pas en silencieux."};
 try{speechSynthesis.speak(u);msg.textContent="Lecture en cours… (touche une autre voix pour recommencer)"}catch(e){msg.textContent="Lecture impossible sur cet appareil."}
}

  if(!pr){er.textContent="Indiquez le prénom de l'enfant.";return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){er.textContent="Cette adresse email ne semble pas valide.";return}
  if(!document.getElementById("ok").checked){er.textContent="Cochez la case pour continuer.";return}
  if(BREVO){const d=new FormData();d.append("EMAIL",em);d.append("email_address_check","");d.append("locale","fr");
   try{fetch(BREVO,{method:"POST",body:d,mode:"no-cors"}).catch(()=>{})}catch(x){}}
  store.set("zz-parent","1");store.set("zz-name",pr.slice(0,24));store.set("zz-roi",roi);dipShow();
 };
}

 const name=store.get("zz-name")||"", roi=store.get("zz-roi")||"ROI", n=played.length;
 const d=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
 app.innerHTML=`<div class="row noprint"><button class="btn white small" onclick="home()">← Menu</button><button class="btn small" onclick="print()">🖨️ Imprimer</button></div>
 <div class="dip"><div class="md">👑</div>
  <div class="k1">LES HISTOIRES ZINZINS</div>
  <h2>DIPLÔME OFFICIEL</h2><div class="tx">est fièrement décerné à</div>
  <div class="nm">${esc(name)}</div>
  <div class="ti">${roi} DES FOUS RIRES</div>
  <div class="tx">${n?`pour avoir fait rire toute la famille avec <b>${n} histoire${n>1?'s':''} zinzin${n>1?'s':''}</b> dans l'appli`:'pour son imagination débordante et ses histoires complètement zinzins'} !<br>${'🤪'.repeat(Math.min(5,Math.max(1,n)))}</div>
  <div class="sg"><div>Le ${d}</div><div><span class="sig">Francis W. Wolff</span><br>l'auteur</div></div></div>
 <div class="noprint center"><p class="muted" style="font-weight:700">Touche « 🖨️ Imprimer » pour l'imprimer ou l'enregistrer en PDF.<br>Joue d'autres histoires : ton diplôme se met à jour tout seul !</p>
 <form id="nf" class="row" style="max-width:420px;margin:0 auto"><input type="text" id="nn" maxlength="24" value="${esc(name)}" aria-label="Prénom" style="flex:2"><button class="btn white small" type="submit">Changer</button></form>
 <div style="height:10px"></div><div class="seg" style="max-width:420px;margin:0 auto"><button class="vbtn ${roi==='ROI'?'sel':''}" onclick="store.set('zz-roi','ROI');dipShow()">👑 Roi</button><button class="vbtn ${roi==='REINE'?'sel':''}" onclick="store.set('zz-roi','REINE');dipShow()">👑 Reine</button></div></div>`;
 document.getElementById("nf").onsubmit=e=>{e.preventDefault();const v=document.getElementById("nn").value.trim();if(v){store.set("zz-name",v.slice(0,24));dipShow()}};
 confetti(); window.scrollTo(0,0);
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
home();
