:root{--bleu:#0b3aa8;--nuit:#061f66;--jaune:#ffd21f;--rouge:#e8282b;--vert:#1fb45a;--blanc:#fff;--encre:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Baloo,system-ui,sans-serif;font-weight:700;color:var(--blanc);background:radial-gradient(ellipse at 50% 0%,#1d5be0 0%,var(--bleu) 45%,var(--nuit) 100%) fixed;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff8,transparent),radial-gradient(2px 2px at 140px 80px,#fff6,transparent),radial-gradient(1.5px 1.5px at 260px 40px,#fff8,transparent),radial-gradient(2px 2px at 330px 150px,#fff5,transparent),radial-gradient(1.5px 1.5px at 80px 190px,#fff7,transparent);background-size:360px 240px;opacity:.7}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
h1,h2,.lg{font-family:LG,Baloo,sans-serif;font-weight:400;letter-spacing:.5px}
.stroke{paint-order:stroke fill;-webkit-text-stroke:6px #000;text-shadow:0 4px 0 #000}
header.home{text-align:center;padding:10px 0 4px}
.n777{font-size:clamp(64px,18vw,118px);line-height:.9;color:var(--jaune);transform:rotate(-3deg);margin:0}
.ttl{font-size:clamp(24px,6.4vw,40px);line-height:1;margin:6px 0 10px;color:#fff}
.pill{display:inline-block;background:#000;color:var(--jaune);border:3px solid var(--jaune);border-radius:40px;padding:6px 18px 3px;font-weight:800;font-size:clamp(15px,4vw,20px)}
.intro{max-width:520px;margin:14px auto 6px;font-size:17px;line-height:1.35;color:#e9efff}
.score{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto 18px;background:#0008;border:3px solid #000;border-radius:18px;padding:8px 14px;width:max-content;max-width:100%;font-size:17px}
.score b{color:var(--jaune);font-family:LG;font-weight:400;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:#fff;color:var(--encre);border:4px solid #000;border-radius:20px;padding:10px 10px 12px;text-align:center;cursor:pointer;box-shadow:0 6px 0 #000;transition:transform .12s;font:inherit}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.card .pic{width:78%;aspect-ratio:1;margin:0 auto 4px}
.card .k{position:absolute;top:8px;left:8px;background:#000;color:#fff;font-family:LG;border-radius:12px;padding:3px 9px 0;font-size:15px}
.card .nm{font-weight:800;font-size:16px;line-height:1.1;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.card .st{margin-top:6px;font-size:14px;color:#555}
.badge{position:absolute;top:6px;right:6px;width:42px;height:42px;border-radius:50%;background:var(--jaune);border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:22px;transform:rotate(12deg)}
footer{text-align:center;margin-top:22px;font-size:13px;color:#c9d6ff;line-height:1.5}
footer a{color:#fff}
/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.btn{font:inherit;font-weight:800;border:3px solid #000;border-radius:16px;padding:10px 16px;background:#fff;color:#000;cursor:pointer;box-shadow:0 4px 0 #000;font-size:16px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.y{background:var(--jaune)}
.btn.big{font-size:20px;padding:14px 22px;width:100%}
.prog{flex:1;height:16px;background:#0006;border:3px solid #000;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--jaune);transition:width .3s}
.qbox{background:#fff;color:var(--encre);border:4px solid #000;border-radius:24px;padding:16px;box-shadow:0 7px 0 #000}
.qhead{display:flex;align-items:center;gap:12px}
.qhead .pic{width:74px;height:74px;flex:none}
.qhead .lbl{font-weight:800;color:var(--bleu);font-size:15px}
.qtext{font-size:clamp(20px,5.4vw,27px);line-height:1.2;margin:10px 0 14px;font-weight:800}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:800;text-align:left;font-size:clamp(17px,4.6vw,21px);padding:14px 16px;border:3px solid #000;border-radius:16px;background:#eef3ff;color:#000;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 #000}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bleu);color:#fff;display:flex;align-items:center;justify-content:center;font-family:LG;font-size:17px;padding-top:2px}
.opt.ok{background:#c9f6d8;border-color:#0b7a35}.opt.ok .l{background:var(--vert)}
.opt.ko{background:#ffd5d5;border-color:#a40f12}.opt.ko .l{background:var(--rouge)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:28px;font-size:20px;font-weight:800;text-align:center}
.fb.ok{color:#0b7a35}.fb.ko{color:#a40f12}
.next{margin-top:12px;display:none}
/* fin */
.end{text-align:center}
.end .sc{font-size:clamp(56px,16vw,96px);color:var(--jaune);margin:6px 0}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0 6px}
.end p{font-size:19px;line-height:1.35;margin:6px auto 16px;max-width:460px}
.medal{width:150px;height:150px;margin:6px auto 0}
.row{display:grid;gap:10px;max-width:420px;margin:0 auto}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
.hidden{display:none}
</style></head><body>

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RANKS=[[10,'Génie absolu !','Un sans-faute. Tu peux officiellement épater tout le monde.'],[8,'Expert !','Badge gagné ! Tu connais ce chapitre sur le bout des doigts.'],[5,'Pas mal du tout !','Encore un petit effort pour décrocher le badge (8 sur 10).'],[0,'Bien essayé !','Relis le chapitre dans le livre, puis retente ta chance.']];
const badges=()=>Q.filter(c=>(S.best[c.n]||0)>=8).length;
function home(){
  const nb=badges();
  app.innerHTML=`<header class="home"><h1 class="n777 stroke">777</h1><h2 class="ttl stroke">FAITS INCROYABLES</h2><span class="pill">Les quiz du livre</span>
  <p class="intro">Tu as lu un chapitre ? Choisis-le et réponds aux 10 questions. Avec 8 bonnes réponses ou plus, tu gagnes le badge du chapitre !</p></header>
  <div class="score">🏆 Badges : <b>${nb} / 10</b>${nb==10?' — <b>SUPER-EXPERT !</b>':''}</div>
  <div class="grid">${Q.map(c=>{const b=S.best[c.n];return `<button class="card" data-n="${c.n}" aria-label="Chapitre ${c.n} : ${esc(c.t)}"><span class="k">${c.n}</span>${b>=8?'<span class="badge" aria-label="badge gagné">⭐</span>':''}<div class="pic">${c.img}</div><div class="nm">${esc(c.short)}</div><div class="st">${b==null?'Pas encore joué':'Meilleur score : '+b+'/10'}</div></button>`}).join('')}</div>
  <footer>Un bonus du livre <b>« 777 faits incroyables pour les garçons curieux »</b> de Francis W. Wolff.<br>Aucune inscription, aucune publicité : tes scores restent sur cet appareil.</footer>`;
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(+b.dataset.n));
  scrollTo(0,0);
}
let R;
function start(n){const c=Q.find(x=>x.n==n);R={c,i:0,good:0,qs:shuffle(c.qs).map(q=>{const idx=shuffle(q.o.map((_,k)=>k));return{q:q.q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)}})};ask()}
function ask(){
  const {c,i,qs}=R, q=qs[i];
  app.innerHTML=`<div class="top"><button class="btn" id="back">← Menu</button><div class="prog" aria-hidden="true"><i style="width:${i*10}%"></i></div><span class="lg" style="font-size:20px">${i+1}/10</span></div>
  <div class="qbox pop"><div class="qhead"><div class="pic">${c.img}</div><div><div class="lbl">CHAPITRE ${c.n}</div><div style="font-weight:800;font-size:17px">${esc(c.t)}</div></div></div>
  <div class="qtext">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABC'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="fb" id="fb" aria-live="polite"></div><button class="btn y big next" id="next">${i<9?'Question suivante →':'Voir mon score 🏆'}</button></div>`;
  $('#back').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $('#next').onclick=()=>{R.i++; R.i<10?ask():end()};
}
const OK=['Bravo !','Exact !','Bien joué !','Trop fort !','Parfait !','Oui, c\'est ça !'];
function answer(k){
  const q=R.qs[R.i], opts=app.querySelectorAll('.opt'), fb=$('#fb');
  opts.forEach(o=>o.disabled=true);
  opts[q.a].classList.add('ok');
  if(k==q.a){R.good++;fb.className='fb ok';fb.textContent='✅ '+OK[Math.floor(Math.random()*OK.length)]}
  else{opts[k].classList.add('ko');fb.className='fb ko';fb.textContent='❌ Raté ! La bonne réponse : '+q.o[q.a]}
  $('#next').style.display='block';
}
function confetti(){const cols=['#ffd21f','#e8282b','#1fb45a','#fff','#43a1ff'];for(let i=0;i<70;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%5];d.style.animationDuration=(1.6+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
function end(){
  const {c,good}=R, before=badges(), prev=S.best[c.n];
  if(prev==null||good>prev){S.best[c.n]=good;save()}
  const r=RANKS.find(x=>good>=x[0]), newBadge=good>=8&&!(prev>=8), nb=badges();
  const nextC=Q.find(x=>x.n==c.n+1);
  app.innerHTML=`<div class="end"><div class="qbox pop" style="text-align:center"><div class="medal">${good>=8?Q[4].img:c.img}</div>
  <h2 class="lg" style="font-size:30px;margin:6px 0 0;color:#0b3aa8">${r[1]}</h2><div class="sc lg stroke">${good}/10</div>
  <div class="stars">${'⭐'.repeat(good>=10?3:good>=8?2:good>=5?1:0)||'💪'}</div>
  <p>${r[2]}${newBadge?'<br><b>🏅 Nouveau badge : '+esc(c.short)+' !</b>':''}${nb==10&&before<10?'<br><b>🎉 Les 10 badges : tu es SUPER-EXPERT !</b>':''}</p>
  <div class="row"><button class="btn y big" id="again">Rejouer ce quiz</button>${nextC?`<button class="btn big" id="nxt">Chapitre ${nextC.n} →</button>`:''}<button class="btn big" id="menu">Tous les quiz</button></div></div></div>`;
  $('#again').onclick=()=>start(c.n); $('#menu').onclick=home; if(nextC)$('#nxt').onclick=()=>start(nextC.n);
  if(good>=8)confetti(); scrollTo(0,0);
}
home();
</script></body></html>
